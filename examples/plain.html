<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astroway widget example</title>
  <style>
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h1>Natal chart</h1>
  <p>Enter a date, time and place. Everything is calculated in your browser.</p>

  <div data-astroway-widget="natal" data-lang="en" data-theme="dark"></div>

  <p style="font-size:.85rem;opacity:.7">
    Chart engine by <a href="https://app.astroway.info" target="_blank" rel="noopener">Astroway</a>.
  </p>

  <script src="https://app.astroway.info/widget.js" async></script>
</body>
</html>
